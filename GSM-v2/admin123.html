*{box-sizing:border-box}body{margin:0;background:#010308;color:#eaf8ff;font-family:Orbitron,system-ui;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#09233855,transparent 55%);pointer-events:none}.wrap{width:min(1180px,94vw);margin:0 auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00eaff22;padding-bottom:18px}.brand{color:#00eaff;font-weight:900;letter-spacing:.18em}.brand small{display:block;color:#61738a;font-size:8px;margin-top:6px}.logout{border:1px solid #ff465555;background:#250914;color:#ff9eaa;padding:10px 14px;font:700 9px Orbitron;cursor:pointer}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:18px}.panel{border:1px solid #00eaff22;background:#030913e8;padding:20px;box-shadow:0 20px 70px #0008}.panel h2{font-size:12px;letter-spacing:.16em;margin:0 0 16px;color:#00eaff}.row{display:flex;gap:10px;flex-wrap:wrap}.input,.select{flex:1;min-width:150px;background:#02050b;border:1px solid #ffffff18;color:#eaf8ff;padding:12px;font:700 10px Orbitron}.btn{border:1px solid #00eaff55;background:#082131;color:#c9f8ff;padding:12px 15px;font:800 9px Orbitron;cursor:pointer}.btn:hover{background:#0d3147}.btn.primary{background:#00d9ef;color:#001015}.btn.danger{background:#4c1020;color:#fff;border-color:#ff4c6b}.players{margin-top:14px;max-height:440px;overflow:auto;border-top:1px solid #ffffff0b}.player{display:grid;grid-template-columns:1fr 100px 100px 110px;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid #ffffff08;font-size:9px}.player:hover{background:#ffffff04}.muted{color:#71859c}.money{color:#ffd84d}.tokens{color:#bca8ff}.codes{display:grid;gap:10px}.code{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid #ffffff0d;padding:13px;background:#02050b}.code-name{font-size:10px}.reward{display:block;color:#71859c;font-size:7px;margin-top:5px}.switch{border:1px solid #ffffff22;background:#140b12;color:#ff7b8c;padding:8px 12px;font:800 8px Orbitron;cursor:pointer}.switch.on{background:#062d20;color:#6dffb0;border-color:#39ff9b55}.status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#020711f5;border:1px solid #00eaff44;padding:12px 18px;color:#8ff4ff;font-size:9px;display:none;z-index:20}.status.show{display:block}.danger-note{color:#ff8392;font-size:8px;line-height:1.7;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.player{grid-template-columns:1fr 80px 80px}.player button{grid-column:1/-1}.top{gap:12px}.row .input{min-width:100%}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">GSM // ADMIN 123<small>GEOMETRIC SPACE MISSION V2 · CONTROL CENTER</small></div><button class="logout" id="logout">SIGN OUT</button></header><div class="grid"><section class="panel"><h2>PLAYER CONTROL</h2><div class="row"><input class="input" id="search" placeholder="Search callsign / player ID"><input class="input" id="crix" type="number" min="0" max="1000000" placeholder="Crix to add"><input class="input" id="tokens" type="number" min="0" max="1000000" placeholder="M-Tokens to add"><button class="btn primary" id="give-selected">GIVE SELECTED</button></div><div class="row" style="margin-top:10px"><select class="select" id="ship"><option value="">Select ship to grant</option><option value="ship_echo">Echo — 16 cards</option><option value="ship_nova">Nova — 10 cards</option><option value="ship_orchid">Orchid — 20 cards</option><option value="ship_haul">Haul — 3 cards</option><option value="ship_hydro">Hydro — 12 cards</option><option value="ship_zed_black">Zed Black — 4 cards</option><option value="ship_vite">Vite — 9 cards</option><option value="ship_moraine">Moraine — 20 cards</option></select><button class="btn" id="give-ship">GIVE SHIP + REQUIRED CARDS</button></div><div class="players" id="players"></div></section><aside class="panel"><h2>BROADCAST REWARD</h2><div class="row"><input class="input" id="all-crix" type="number" min="0" max="1000000" placeholder="Crix for everyone"><input class="input" id="all-tokens" type="number" min="0" max="1000000" placeholder="M-Tokens for everyone"><button class="btn danger" id="give-all">GIVE TO EVERYONE</button></div><p class="danger-note">This updates every player account. Use carefully.</p><h2 style="margin-top:28px">ADMIN CODES</h2><div class="codes" id="codes"></div></aside></div></main><div class="status" id="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.83.0/dist/umd/supabase.min.js"></script><script>
(()=>{const URL="https://ccdllfswfhtgcolkugbz.supabase.co",KEY="sb_publishable_LPd-zxWUKM8c1p2P9sbbuA_EmhtqQr5",sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let session=null,players=[],codes=[],active=[],selected="";
function status(t){const e=$("status");e.textContent=t;e.classList.add("show");clearTimeout(status.t);status.t=setTimeout(()=>e.classList.remove("show"),2400)}
async function invoke(action,body={}){if(!session?.access_token)throw Error("Sign in required");const {data,error}=await sb.functions.invoke("admin-panel",{body:{action,...body},headers:{Authorization:"Bearer "+session.access_token}});if(error)throw Error(error.message||"Admin request failed");if(!data?.ok)throw Error(data?.error||"Admin request failed");return data}
function renderPlayers(){const q=$("search").value.trim().toLowerCase();const list=players.filter(p=>(p.username||"").toLowerCase().includes(q)||p.id.toLowerCase().includes(q));$("players").innerHTML=list.map(p=>`<div class="player"><div><b>${esc(p.username||"PILOT")}</b><div class="muted">${p.id}</div></div><div class="money">₢ ${Number(p.crix||0)}</div><div class="tokens">MT ${Number(p.m_tokens||0)}</div><button class="btn" data-id="${p.id}">${selected===p.id?"SELECTED":"SELECT"}</button></div>`).join("")||'<div class="muted" style="padding:20px">No players found.</div>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderPlayers()})}
function renderCodes(){const state=Object.fromEntries(active.map(x=>[x.code_name,x.active]));$("codes").innerHTML=codes.map(c=>{const on=state[c.name]!==false;return `<div class="code"><div class="code-name"><b>${c.name}</b><span class="reward">₢ ${c.crix_reward} · M-TOKENS ${c.m_tokens_reward}</span></div><button class="switch ${on?"on":""}" data-code="${c.name}" data-active="${on}">${on?"ACTIVE":"INACTIVE"}</button></div>`}).join("");document.querySelectorAll("[data-code]").forEach(b=>b.onclick=async()=>{try{const next=b.dataset.active!=="true";await invoke("set_code_active",{name:b.dataset.code,active:next});await load();status(b.dataset.code+" // "+(next?"ACTIVE":"INACTIVE"))}catch(e){status(e.message)}})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function load(){const d=await invoke("list_players");players=d.players||[];codes=d.codes||[];active=d.active||[];renderPlayers();renderCodes()}
$("search").oninput=renderPlayers;
$("give-selected").onclick=async()=>{try{if(!selected)throw Error("Select a player first.");const c=Math.floor(Number($("crix").value||0)),m=Math.floor(Number($("tokens").value||0));await invoke("add_currency",{player_id:selected,crix:c,m_tokens:m});await load();status("PLAYER REWARDED")}catch(e){status(e.message)}};
$("give-ship").onclick=async()=>{try{if(!selected)throw Error("Select a player first.");const ship=$( "ship").value;if(!ship)throw Error("Select a ship first.");const d=await invoke("grant_ship",{player_id:selected,ship_id:ship});await load();status(d.ship+" GRANTED // "+d.cards_granted+" CARDS ADDED")}catch(e){status(e.message)}};
$("give-all").onclick=async()=>{try{const c=Math.floor(Number($("all-crix").value||0)),m=Math.floor(Number($("all-tokens").value||0));if(!confirm("Give these rewards to EVERY player?"))return;const d=await invoke("add_currency_all",{crix:c,m_tokens:m});await load();status("REWARDED "+d.updated+" PLAYERS")}catch(e){status(e.message)}};
$("logout").onclick=async()=>{await sb.auth.signOut();location.href="login.html"};
(async()=>{try{const r=await sb.auth.getSession();session=r.data.session;if(!session){location.href="login.html";return}await load()}catch(e){status(e.message)}})()})();
</script><audio id="bgMusic" loop preload="auto" src="sounds/lobby-music.wav"></audio>
<script>
(()=>{const m=document.getElementById("bgMusic");if(!m)return;const start=()=>{m.volume=0.32;m.play().catch(()=>{})};document.addEventListener("pointerdown",start,{once:true});document.addEventListener("keydown",start,{once:true});})();
</script>
<audio id="uiHover" preload="auto" src="sounds/button-hover.mp3"></audio>
<audio id="uiClick" preload="auto" src="sounds/button-click.mp3"></audio>
<script>
(()=>{const h=document.getElementById("uiHover"),c=document.getElementById("uiClick");const play=a=>{if(!a)return;try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}};document.addEventListener("pointerover",e=>{if(e.target.closest("button,a,[role=\"button\"]"))play(h)});document.addEventListener("click",e=>{if(e.target.closest("button,a,[role=\"button\"]"))play(c)});})();
</script>
