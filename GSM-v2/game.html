<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometric Space Mission // V2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#e8fbff;font-family:Orbitron,system-ui}
body{display:grid;place-items:center}
#auth{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#06334a55,transparent 40%),#02040a;display:grid;place-items:center}
.card{width:min(430px,92vw);padding:32px;border:1px solid #00eaff66;border-radius:18px;background:#050914ee;box-shadow:0 0 60px #00eaff18}
.logo{text-align:center;color:#00eaff;font-size:24px;font-weight:900;letter-spacing:.14em}.sub{text-align:center;color:#70839c;font-size:10px;letter-spacing:.18em;margin:8px 0 24px}
input{width:100%;padding:13px;margin:5px 0;background:#080d18;border:1px solid #24334a;border-radius:8px;color:white;font-family:inherit;outline:none}input:focus{border-color:#00eaff}
button{font-family:inherit;cursor:pointer}.authbtn{width:100%;padding:13px;margin-top:9px;background:#062b37;border:1px solid #00eaff;color:#00eaff;border-radius:8px;font-weight:800}.authbtn:hover{background:#00eaff1c;box-shadow:0 0 20px #00eaff22}.switch{width:100%;border:0;background:none;color:#8295ad;padding:12px}.msg{text-align:center;min-height:18px;color:#ff7180;font-size:11px}
#app{width:100vw;height:100vh;display:none;position:relative}.top{height:54px;position:absolute;z-index:10;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#02040ad9;border-bottom:1px solid #00eaff22}
.brand{font-weight:900;letter-spacing:.12em;color:#00eaff}.brand small{display:block;font-size:8px;color:#657991;letter-spacing:.2em}
.account{font-size:10px;color:#8ca1ba}.logout{margin-left:14px;color:#ff7180;background:none;border:0;font-size:9px}
#gameWrap{position:absolute;inset:54px 0 0;display:grid;place-items:center}.game{width:min(1180px,96vw);height:min(760px,calc(100vh - 72px));position:relative;border:2px solid #7b43e6;border-radius:14px;overflow:hidden;box-shadow:0 0 50px #4b16a844;background:#000}
canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:0;left:0;right:0;padding:11px 14px;display:flex;justify-content:space-between;background:#0009;font-size:11px;z-index:3}.hud span{color:#00eaff}.hud .mt{color:#c084fc}.boss{display:none;position:absolute;top:57px;left:50%;transform:translateX(-50%);width:min(430px,60%);z-index:4;text-align:center}.boss b{color:#ff4d67;font-size:11px}.bar{height:10px;border:1px solid #ff4d67;background:#120308;margin-top:4px}.bar i{display:block;width:100%;height:100%;background:#ff3f5d}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#000d;z-index:5}.panel{width:min(560px,88%);text-align:center}.title{font-size:42px;font-weight:900;color:#a55eea;text-shadow:0 0 20px #7128d9}.info{color:#8da0b7;line-height:1.8;font-size:12px}.play{margin-top:20px;padding:14px 34px;border-radius:12px;border:0;border-bottom:6px solid #a70016;background:#ef4444;color:white;font-weight:900;letter-spacing:.1em;box-shadow:0 15px 30px #ef444466}.play:hover{transform:translateY(-2px);background:#f87171}.play:active{transform:translateY(5px);border-bottom-width:1px}
.controls{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:4;pointer-events:none}.ctrl{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:#321078aa;border:2px solid #a55eea;color:#fff;font-weight:900}.fire{width:78px;height:78px;background:#c51d3faa;border-color:#ff7a89}.ability{background:#a98600aa;border-color:#ffe066}
#toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);z-index:7;color:#fff;font-weight:800;text-shadow:0 0 10px #00eaff;pointer-events:none}
@media(max-width:700px){.title{font-size:28px}.game{width:100vw;height:calc(100vh - 54px);border-radius:0}.hud{font-size:9px}.brand{font-size:12px}}
</style>
</head>
<body>
<div id="app" style="display:block">
<div class="top"><div class="brand">GEOMETRIC SPACE MISSION<small>V2 // MISSION CONTROL</small></div><div class="account"><span id="pilotName"></span><button id="logout" class="logout">SIGN OUT</button></div></div>
<div id="gameWrap"><div class="game"><canvas id="game"></canvas>
<div class="hud"><div>SCORE <span id="score">0</span> &nbsp; LVL <span id="level">1</span> &nbsp; LIVES <span id="lives">3</span></div><div>₢ <span id="crix">0</span> &nbsp; <span class="mt">M</span> <span id="mtokens" class="mt">0</span></div></div>
<div id="boss" class="boss"><b id="bossName">BOSS</b><div class="bar"><i id="bossBar"></i></div></div>
<div id="toast"></div><div id="overlay" class="overlay"><div class="panel"><div class="title">MISSION READY</div><div id="missionInfo" class="info"></div><button id="start" class="play">PLAY MISSION</button></div></div>
<div class="controls"><div><button id="left" class="ctrl">&lt;</button><button id="right" class="ctrl">&gt;</button></div><div><button id="ability" class="ctrl ability">⚡</button><button id="fire" class="ctrl fire">FIRE</button></div></div>
</div></div></div>
<audio id="uiHover" preload="auto" src="sounds/button-hover.mp3"></audio>
<audio id="uiClick" preload="auto" src="sounds/button-click.mp3"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="game.js"></script>
</body></html>
