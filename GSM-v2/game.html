<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GSM V2 // Combat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#e9fbff;font-family:Orbitron,system-ui}
body{display:grid;place-items:center}.shell{position:relative;width:min(940px,94vw);height:min(760px,92vh);background:#02040a;border:2px solid rgba(0,234,255,.42);box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 0 45px rgba(0,234,255,.12),0 25px 80px rgba(0,0,0,.65);overflow:hidden}
.shell:after{content:"";position:absolute;inset:2px;z-index:6;pointer-events:none;border:2px solid hsl(var(--kill-hue,185) 100% 60% / .45);box-shadow:0 0 18px hsl(var(--kill-hue,185) 100% 60% / .22);transform:rotate(var(--kill-rotation,0deg));transition:transform .18s ease,border-color .12s ease,box-shadow .12s ease}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.kill-banner{position:absolute;z-index:12;left:50%;top:18%;transform:translate(-50%,-20px) scale(.8);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;color:#fff;font-size:22px;font-weight:900;letter-spacing:.12em;text-shadow:0 0 18px currentColor;transition:opacity .12s,transform .12s}.kill-banner img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 0 12px currentColor)}.kill-banner.show{opacity:1;transform:translate(-50%,0) scale(1)}.kill-banner.hide{opacity:0;transform:translate(-50%,12px) scale(.92)}.kill-banner strong{font-size:30px}.pause-overlay{position:absolute;z-index:20;inset:0;display:none;place-items:center;background:rgba(2,4,10,.78);backdrop-filter:blur(7px)}.pause-card{width:min(520px,86%);padding:32px;text-align:center;border:1px solid #00eaff55;background:#030813f2;box-shadow:0 0 70px #00eaff18}.pause-kicker{font-size:8px;letter-spacing:.35em;color:#657991}.pause-title{margin:10px 0 12px;color:#00eaff;font-size:clamp(28px,5vw,48px);font-weight:900}.pause-info{color:#91a5bb;font-size:10px;line-height:2;margin-bottom:6px}.pause-info span{opacity:.6}.pause-card .btn{display:block;margin:14px auto 0;min-width:210px}.pause-card .exit-btn{background:#ff405d;color:#fff;box-shadow:0 0 25px #ff405d44}.hud{position:absolute;z-index:5;top:0;left:0;right:0;height:58px;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#02040af2,#02040a99,transparent);pointer-events:none}
.hud .row{display:flex;gap:18px;align-items:center}.metric{font-size:11px;color:#8295aa}.metric b{color:#00eaff;font-size:13px}.brand{font-weight:900;letter-spacing:.12em;color:#00eaff}.brand small{display:block;font-size:7px;color:#657991;letter-spacing:.2em}
.hull{position:absolute;z-index:5;top:62px;left:50%;transform:translateX(-50%);width:min(360px,48vw);pointer-events:none;text-align:center}.hull label{font-size:7px;letter-spacing:.2em;color:#8295aa}.hull .track{height:7px;margin-top:4px;border:1px solid #ff526b;background:#18070b}.hull i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff3157,#ffb020,#76ff03)}
.ability{position:absolute;z-index:5;right:18px;top:65px;width:120px;pointer-events:none}.ability label{font-size:7px;color:#ffd95a}.ability .track{height:6px;background:#18130a;border:1px solid #806500}.ability i{display:block;height:100%;width:100%;background:#ffd42a}
.menu{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 52%,#071a2b99,#02040af5 62%);text-align:center}.card{width:min(620px,88vw);padding:35px 28px;border:1px solid #00eaff44;background:#030813e8;box-shadow:0 0 80px #00eaff16}.eyebrow{font-size:9px;letter-spacing:.35em;color:#657991}.title{margin:10px 0;color:#00eaff;font-size:clamp(30px,6vw,62px);font-weight:900;text-shadow:0 0 25px #00eaff55}.info{color:#91a5bb;font-size:10px;line-height:2}.btn{margin-top:20px;padding:14px 30px;background:#00eaff;color:#001014;border:0;font:900 12px Orbitron;letter-spacing:.15em;cursor:pointer;box-shadow:0 0 25px #00eaff55}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.controls{position:absolute;z-index:8;left:0;right:0;bottom:20px;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}.cluster{display:flex;gap:10px}.ctrl{pointer-events:auto;width:62px;height:62px;border-radius:50%;border:1px solid #8d5cff;background:#100a28cc;color:white;font:900 18px Orbitron;box-shadow:0 0 18px #6b35cc33;touch-action:none}.ctrl:active{transform:scale(.92)}.fire{width:82px;height:82px;border-color:#ff6377;background:#45101acc;color:#ffb1ba;font-size:11px}.abilityBtn{border-color:#ffd42a;color:#ffe98b;background:#332900cc}
.toast{position:absolute;z-index:7;left:50%;top:18%;transform:translateX(-50%);font-size:12px;font-weight:900;text-shadow:0 0 15px #00eaff;pointer-events:none}
@media(max-width:700px){.brand{font-size:10px}.hud{height:50px;padding:6px 9px}.hud .row{gap:8px}.metric{font-size:7px}.metric b{font-size:9px}.hull{top:52px;width:55vw}.ability{top:61px;right:8px;width:80px}.controls{bottom:13px;padding:0 10px}.ctrl{width:54px;height:54px}.fire{width:70px;height:70px}}
</style></head><body>
<div class="shell" id="game-container"><canvas id="game-canvas"></canvas><div class="kill-banner" id="kill-banner"><img src="images/kill_banner.png" alt=""><div><strong id="kill-count">1</strong> KILL</div></div><div class="pause-overlay" id="pause-overlay"><div class="pause-card"><div class="pause-kicker">SYSTEM PAUSED</div><div class="pause-title">MISSION PAUSED</div><div class="pause-info">Press <b>ESC</b> to return to lobby<br><span>Press ESC again after resuming to exit.</span></div><button class="btn" id="resume-button">RESUME MISSION</button><button class="btn exit-btn" id="exit-button">EXIT TO LOBBY</button></div></div>
<div class="hud"><div class="row"><div class="brand">GSM // V2<small>GEOMETRIC SPACE MISSION</small></div><div class="metric">SCORE <b id="score-display">0</b></div><div class="metric">LV <b id="level-display">1</b></div><div class="metric">LIVES <b id="lives-display">3</b></div></div><div class="row"><div class="metric">₢ <b id="cret-display">10</b></div><div class="metric">XP <b id="xp-display">0</b>/<b id="next-xp-display">100</b></div></div></div>
<div class="hull"><label>PLAYER HULL</label><div class="track"><i id="player-hp-fill"></i></div></div>
<div class="ability"><label>ABILITY</label><div class="track"><i id="ability-bar-fill"></i></div></div>
<div class="toast" id="temp-message-container"></div>
<div class="menu" id="message-box"><div class="card"><div class="eyebrow">MISSION CONTROL // COMBAT SIMULATION</div><div class="title" id="menu-title">MISSION READY</div><div class="info" id="menu-info">Initialize combat systems.</div><button class="btn" id="start-button">LAUNCH MISSION</button></div></div>
<div class="controls"><div class="cluster"><button class="ctrl" id="move-left-btn">◀</button><button class="ctrl" id="move-right-btn">▶</button></div><div class="cluster"><button class="ctrl abilityBtn" id="ability-btn">⚡</button><button class="ctrl fire" id="fire-btn">FIRE</button></div></div>
<audio id="uiHover" preload="auto" src="sounds/button-hover.mp3"></audio><audio id="uiClick" preload="auto" src="sounds/button-click.mp3"></audio><audio id="bulletShoot" preload="auto" src="sounds/bullet shoot.wav"></audio><audio id="hullDamage" preload="auto" src="sounds/damage_hull_from_bullet.wav"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.83.0/dist/umd/supabase.min.js"></script><script src="game.js"></script></div></body></html>
