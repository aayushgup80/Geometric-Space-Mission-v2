<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GSM V2 // Combat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010308;color:#eaf8ff;font-family:Orbitron,system-ui}body{display:grid;place-items:center}
.shell{position:relative;width:min(1180px,96vw);height:min(820px,94vh);overflow:hidden;background:#02050b;border:1px solid #19dfff45;box-shadow:0 0 0 1px #fff08 inset,0 30px 100px #000b,0 0 70px #00d9ff10}
canvas{position:absolute;inset:0;width:100%;height:100%}
.topbar{position:absolute;z-index:8;inset:0 0 auto;height:72px;padding:0 24px;display:flex;align-items:center;gap:22px;background:linear-gradient(#02050bf5,#02050bd8,transparent);border-bottom:1px solid #ffffff0b;pointer-events:none}
.brand{color:#00eaff;font-weight:900;letter-spacing:.18em;font-size:14px}.brand small{display:block;color:#61738a;font-size:7px;letter-spacing:.3em;margin-top:4px}.metrics{display:flex;gap:18px}.metric{font-size:8px;color:#71859c;letter-spacing:.13em}.metric b{color:#eaf8ff;font-size:12px;margin-left:5px}.metric.c b{color:#ffd84d}
.hull{position:absolute;z-index:8;top:78px;left:24px;width:330px}.hull label,.ability label{display:flex;justify-content:space-between;color:#70859c;font-size:7px;letter-spacing:.2em}.track{height:7px;margin-top:5px;border:1px solid #ff496655;background:#17070b}.track i{display:block;height:100%;background:linear-gradient(90deg,#ff3157,#ffb52d,#6dff4a);transition:width .15s}
.ability{position:absolute;z-index:8;top:78px;right:24px;width:180px}.ability .track{border-color:#ffd64a55;background:#1c1605}.ability i{background:#ffd52d}
.kill-banner{position:absolute;z-index:70;left:50%;top:20%;transform:translate(-50%,-15px) scale(.8);opacity:0;display:flex;align-items:center;gap:9px;color:#fff;font-size:18px;font-weight:900;letter-spacing:.12em;text-shadow:0 0 18px currentColor;pointer-events:none;transition:.12s}.kill-banner img{width:54px;height:54px;object-fit:contain}.kill-banner.show{opacity:1;transform:translate(-50%,0) scale(1)}.kill-banner.hide{opacity:0;transform:translate(-50%,10px) scale(.9)}
.kill-ring{position:absolute;z-index:69;left:50%;top:20%;width:94px;height:94px;transform:translate(-50%,-15px);opacity:0;border:2px dashed #00eaffaa;border-radius:50%;pointer-events:none}.kill-ring.show{opacity:1;animation:ringSpin .65s linear}@keyframes ringSpin{to{transform:translate(-50%,-15px) rotate(360deg)}}.kill-ring:before,.kill-ring:after{content:"";position:absolute;border-radius:50%;border:2px dashed transparent}.kill-ring:before{inset:-7px;border-top-color:currentColor;border-bottom-color:currentColor}.kill-ring:after{inset:10px;border-left-color:currentColor;border-right-color:currentColor}
.pause-overlay{position:absolute;z-index:100;pointer-events:auto;inset:0;display:none;place-items:center;background:#01040bd9;backdrop-filter:blur(12px)}.pause-card{width:min(520px,90%);padding:34px;border:1px solid #00eaff45;background:#030a14f5;box-shadow:0 0 80px #00eaff16;text-align:center}.kicker{font-size:7px;letter-spacing:.35em;color:#63758b}.pause-card h1{margin:10px 0;color:#00eaff;font-size:38px}.pause-card p{font-size:9px;color:#8194aa;line-height:1.8}.pause-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{position:relative;z-index:101;pointer-events:auto;border:1px solid #00eaff55;background:#082131;color:#c9f8ff;padding:14px 12px;font:800 10px Orbitron;letter-spacing:.1em;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-2px);background:#0d3147;box-shadow:0 0 22px #00eaff22}.btn.primary{background:#00d9ef;color:#001015;border-color:#8ef7ff}.btn.danger{background:#4c1020;color:#fff;border-color:#ff4c6b}.btn.wide{grid-column:1/-1}
.menu{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#08263c77,#010308f5 68%)}.card{width:min(650px,88%);padding:42px;text-align:center;border:1px solid #00eaff35;background:#030913eb;box-shadow:0 0 100px #00eaff12}.eyebrow{font-size:8px;color:#63768c;letter-spacing:.32em}.title{margin:12px 0;color:#00eaff;font-size:clamp(32px,6vw,64px);font-weight:900}.info{color:#8ba0b6;font-size:9px;line-height:2}.launch{margin-top:24px}.launch .btn{min-width:240px}
.controls{position:absolute;z-index:12;left:0;right:0;bottom:22px;display:flex;justify-content:space-between;padding:0 24px;pointer-events:none}.cluster{display:flex;gap:10px}.ctrl{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid #8e64ff88;background:#100a25dd;color:#fff;font:900 17px Orbitron;cursor:pointer;touch-action:none}.ctrl.fire{width:76px;height:76px;border-color:#ff536c;background:#43101cdd;color:#ffb3be;font-size:10px}.ctrl.abilityBtn{border-color:#ffd542;color:#ffe994}
.toast{position:absolute;z-index:55;left:50%;top:auto;bottom:92px;transform:translate(-50%,15px);font-size:10px;font-weight:900;color:#00eaff;text-shadow:0 0 14px #00eaff;pointer-events:none;opacity:0;transition:.12s}.toast.show{opacity:1;transform:translate(-50%,0)}
.fps{position:absolute;z-index:13;right:24px;bottom:18px;color:#6dff9e;font-size:8px;display:none}
@media(max-width:700px){.shell{width:100vw;height:100vh;border:0}.topbar{padding:0 12px;height:60px}.brand{font-size:10px}.metrics{gap:7px}.metric{font-size:6px}.metric b{font-size:9px}.hull{top:65px;left:12px;width:42vw}.ability{top:65px;right:12px;width:28vw}.controls{bottom:12px;padding:0 10px}.ctrl{width:52px;height:52px}.ctrl.fire{width:68px;height:68px}.pause-actions{grid-template-columns:1fr}.btn.wide{grid-column:auto}}
</style></head><body><main class="shell" id="game-container">
<canvas id="game-canvas"></canvas>
<div class="topbar"><div class="brand">GSM // V2<small>GEOMETRIC SPACE MISSION</small></div><div class="metrics"><div class="metric">SCORE<b id="score-display">0</b></div><div class="metric">LV<b id="level-display">1</b></div><div class="metric">LIVES<b id="lives-display">3</b></div><div class="metric c">₢<b id="cret-display">10</b></div><div class="metric">XP<b id="xp-display">0</b>/<b id="next-xp-display">100</b></div></div></div>
<div class="hull"><label>PLAYER HULL <span id="hull-readout">100%</span></label><div class="track"><i id="player-hp-fill"></i></div></div>
<div class="ability"><label>ABILITY <span id="ability-readout">READY</span></label><div class="track"><i id="ability-bar-fill"></i></div></div>
<div class="kill-ring" id="kill-ring"></div><div class="kill-banner" id="kill-banner"><img src="images/kill_banner.png" alt=""><strong id="kill-count">1</strong><span>KILL</span></div><div class="toast" id="temp-message-container"></div><div class="fps" id="fps-overlay">FPS: --</div>
<div class="pause-overlay" id="pause-overlay"><section class="pause-card"><div class="kicker">MISSION CONTROL // PAUSED</div><h1>MISSION PAUSED</h1><p>Combat simulation frozen. Choose an action.</p><div class="pause-actions"><button class="btn primary" id="save-exit-button">SAVE + EXIT</button><button class="btn danger" id="exit-button">EXIT (NO SAVE)</button><button class="btn" id="settings-button">SETTINGS</button><button class="btn" id="resume-button">RESUME</button></div></section></div>
<div class="menu" id="message-box"><section class="card"><div class="eyebrow">MISSION CONTROL // COMBAT SIMULATION</div><div class="title" id="menu-title">MISSION READY</div><div class="info" id="menu-info">Initialize combat systems.</div><div class="launch"><button class="btn primary" id="start-button">LAUNCH MISSION</button></div></section></div>
<div class="controls"><div class="cluster"><button class="ctrl" id="move-left-btn">◀</button><button class="ctrl" id="move-right-btn">▶</button></div><div class="cluster"><button class="ctrl abilityBtn" id="ability-btn">⚡</button><button class="ctrl fire" id="fire-btn">FIRE</button></div></div>
<audio id="uiHover" preload="auto" src="sounds/button-hover.mp3"></audio><audio id="uiClick" preload="auto" src="sounds/button-click.mp3"></audio><audio id="bulletShoot" preload="auto" src="sounds/bullet shoot.wav"></audio><audio id="hullDamage" preload="auto" src="sounds/damage_hull_from_bullet.wav"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.83.0/dist/umd/supabase.min.js"></script><script src="game.js"></script></main></body></html>
