<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometric Space Mission V2 — Loader</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}
body{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eef8ff}
.loader{
  width:100%;height:100%;position:relative;overflow:hidden;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 50%,rgba(28,69,105,.25),transparent 27%),
    radial-gradient(circle at 50% 50%,rgba(10,28,50,.3),transparent 58%),
    #03060d;
}
.grid{
  position:absolute;inset:-10%;
  background-image:
    linear-gradient(rgba(145,205,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(145,205,235,.035) 1px,transparent 1px);
  background-size:72px 72px;
  transform:perspective(500px) rotateX(58deg) scale(1.4);
  transform-origin:center bottom;
  opacity:.5;
}
.stars{position:absolute;inset:0}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#d9f7ff;opacity:.3;
  animation:starDrift 5s linear infinite;
}
@keyframes starDrift{
  from{transform:translateY(-15px);opacity:.05}
  45%{opacity:.5}
  to{transform:translateY(45px);opacity:.08}
}
.scan{
  position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(112,222,255,.45),transparent);
  box-shadow:0 0 18px rgba(80,210,255,.3);
  animation:scan 3.2s linear infinite;
}
@keyframes scan{to{transform:translateY(100vh)}}

.content{
  position:relative;z-index:5;text-align:center;
  width:min(900px,90vw);
}
.kicker{
  opacity:0;color:#6d8096;font-size:10px;letter-spacing:.5em;
  margin-bottom:24px;text-transform:uppercase;
  animation:kickerIn .7s .2s forwards;
}
@keyframes kickerIn{to{opacity:1}}
.title{
  position:relative;margin:0;font-size:clamp(38px,7vw,86px);
  line-height:.95;font-weight:900;letter-spacing:.08em;
  text-transform:uppercase;
}
.word{
  display:block;opacity:0;position:relative;
  text-shadow:0 0 28px rgba(120,220,255,.16);
}
.word.main{
  animation:strikeDown .75s .55s cubic-bezier(.15,.85,.25,1) forwards;
}
.word.space{
  margin-top:8px;
  animation:strikeDown .7s .9s cubic-bezier(.15,.85,.25,1) forwards;
}
@keyframes strikeDown{
  0%{opacity:0;transform:translateY(-180px) skewX(-12deg);filter:blur(8px)}
  55%{opacity:1;transform:translateY(12px) skewX(1deg);filter:blur(0)}
  72%{transform:translateY(-6px)}
  100%{opacity:1;transform:translateY(0) skewX(0)}
}
.word.main:after,.word.space:after{
  content:"";position:absolute;left:-8%;right:-8%;top:50%;
  height:1px;background:linear-gradient(90deg,transparent,#9ceeff,transparent);
  transform:scaleX(0);animation:slash .35s 1.05s forwards;
}
.word.space:after{animation-delay:1.32s}
@keyframes slash{to{transform:scaleX(1)}}

.v2{
  display:inline-block;margin-top:18px;color:#8fe8ff;
  font-size:clamp(22px,4vw,44px);font-weight:900;
  letter-spacing:.32em;padding-left:.32em;
  opacity:0;transform:scale(2.2) translateY(12px);
  filter:blur(5px);
  animation:v2In .65s 1.5s cubic-bezier(.15,.9,.25,1) forwards;
}
@keyframes v2In{
  0%{opacity:0;transform:scale(2.2) translateY(12px);filter:blur(5px)}
  60%{opacity:1;transform:scale(.92) translateY(-2px);filter:blur(0)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.sub{
  margin-top:18px;font-size:9px;letter-spacing:.42em;color:#60738a;
  opacity:0;animation:fade .7s 2s forwards;
}
@keyframes fade{to{opacity:1}}

.button-wrap{
  margin-top:48px;opacity:0;
  animation:buttonIn .65s 2.35s forwards;
}
@keyframes buttonIn{to{opacity:1}}
.enter{
  position:relative;width:270px;height:58px;cursor:pointer;
  border:1px solid rgba(211,246,255,.72);
  color:#06101a;background:linear-gradient(180deg,#eefcff,#9ed9eb);
  font-size:13px;font-weight:900;letter-spacing:.2em;
  clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);
  transition:.2s;
}
.enter:before{
  content:"";position:absolute;inset:3px;
  border:1px solid rgba(6,16,26,.15);
  clip-path:inherit;pointer-events:none;
}
.enter:hover{
  transform:translateY(-2px) scale(1.02);
  filter:brightness(1.08);
  box-shadow:0 0 35px rgba(89,210,255,.3);
}
.enter span{position:relative;z-index:2}
.hint{
  margin-top:12px;color:#56677c;font-size:8px;
  letter-spacing:.25em;text-transform:uppercase;
}

/* CRACK TRANSITION */
.cracks{
  position:absolute;z-index:20;inset:0;pointer-events:none;
  opacity:0;
}
.crack{
  position:absolute;background:#dffaff;
  box-shadow:0 0 8px rgba(143,232,255,.55);
  transform-origin:left center;
}
.crack.main{
  width:58%;height:2px;left:42%;top:45%;
  transform:rotate(-19deg) scaleX(0);
}
.crack.c1{width:25%;height:1px;left:42%;top:45%;transform:rotate(35deg) scaleX(0)}
.crack.c2{width:20%;height:1px;left:53%;top:32%;transform:rotate(-54deg) scaleX(0)}
.crack.c3{width:28%;height:1px;left:47%;top:49%;transform:rotate(77deg) scaleX(0)}
.crack.c4{width:18%;height:1px;left:58%;top:45%;transform:rotate(-82deg) scaleX(0)}
.crack.c5{width:22%;height:1px;left:36%;top:45%;transform:rotate(-120deg) scaleX(0)}

.loader.cracking .cracks{opacity:1}
.loader.cracking .crack.main{animation:crack .22s forwards}
.loader.cracking .crack.c1{animation:crack .18s .05s forwards}
.loader.cracking .crack.c2{animation:crack .18s .08s forwards}
.loader.cracking .crack.c3{animation:crack .18s .1s forwards}
.loader.cracking .crack.c4{animation:crack .18s .13s forwards}
.loader.cracking .crack.c5{animation:crack .18s .16s forwards}
@keyframes crack{to{transform:rotate(var(--r,0deg)) scaleX(1)}}

.shatter{
  position:absolute;z-index:19;inset:0;pointer-events:none;
  opacity:0;background:#02040a;
}
.loader.cracking .shatter{
  animation:shatter .8s .2s cubic-bezier(.6,0,.2,1) forwards;
}
@keyframes shatter{
  0%{opacity:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
  18%{opacity:.15}
  100%{opacity:1;clip-path:polygon(0 0,43% 0,38% 41%,49% 50%,41% 100%,0 100%,0 0,100% 0,100% 100%,58% 100%,52% 54%,61% 47%,56% 0)}
}
.fade-out{
  position:absolute;z-index:30;inset:0;background:#02040a;
  opacity:0;pointer-events:none;
}
.loader.cracking .fade-out{animation:fadeOut .9s .35s forwards}
@keyframes fadeOut{to{opacity:1}}

.corner{
  position:absolute;z-index:4;color:#4f6379;font-size:8px;
  letter-spacing:.2em;text-transform:uppercase;
}
.corner.tl{top:24px;left:28px}.corner.br{bottom:24px;right:28px}
.corner b{color:#82dfff;font-weight:500}
@media(max-height:600px){
  .kicker{margin-bottom:12px}.v2{margin-top:10px}.sub{margin-top:9px}
  .button-wrap{margin-top:22px}.enter{height:50px}
}
</style>
</head>
<body>
<div class="loader" id="loader">
  <audio id="uiHover" preload="auto" src="sounds/button-hover.mp3"></audio>
  <audio id="uiClick" preload="auto" src="sounds/button-click.mp3"></audio>
  <div class="grid"></div>
  <div class="stars" id="stars"></div>
  <div class="scan"></div>

  <div class="corner tl">SYSTEM BOOT // <b>GSM-V2</b></div>
  <div class="corner br">BUILD 02.00 // <b>ONLINE</b></div>

  <main class="content">
    <div class="kicker">Initializing Combat Interface</div>
    <h1 class="title">
      <span class="word main">GEOMETRIC</span>
      <span class="word space">SPACE MISSION</span>
      <span class="v2">V2</span>
    </h1>
    <div class="sub">THE NEXT MISSION BEGINS HERE</div>

    <div class="button-wrap">
      <button class="enter" id="enter"><span>GO TO LOBBY</span></button>
      <div class="hint">Enter to continue</div>
    </div>
  </main>

  <div class="cracks" aria-hidden="true">
    <i class="crack main"></i>
    <i class="crack c1"></i><i class="crack c2"></i><i class="crack c3"></i>
    <i class="crack c4"></i><i class="crack c5"></i>
  </div>
  <div class="shatter"></div>
  <div class="fade-out"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const authClient=window.supabase.createClient("https://ccdllfswfhtgcolkugbz.supabase.co","sb_publishable_LPd-zxWUKM8c1p2P9sbbuA_EmhtqQr5");
const loader=document.getElementById("loader");
const stars=document.getElementById("stars");

for(let i=0;i<110;i++){
  const s=document.createElement("span");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(-Math.random()*5)+"s";
  s.style.opacity=(.08+Math.random()*.35).toFixed(2);
  stars.appendChild(s);
}

let launched=false;

function playSound(audio){
  try{
    audio.currentTime=0;
    audio.play().catch(()=>{});
  }catch(e){}
}

const hoverSound=document.getElementById("uiHover");
const clickSound=document.getElementById("uiClick");

document.querySelectorAll("button").forEach(button=>{
  button.addEventListener("mouseenter",()=>playSound(hoverSound));
  button.addEventListener("click",()=>playSound(clickSound));
});

function launch(){
  if(launched)return;
  launched=true;
  playSound(clickSound);
  loader.classList.add("cracking");

  setTimeout(async()=>{const {data:{session}}=await authClient.auth.getSession();window.location.href=session?.user?"lobby.html":"login.html";},1150);
}

document.getElementById("enter").addEventListener("click",launch);

document.addEventListener("keydown",e=>{
  if(e.key==="Enter")launch();
});
</script>
<audio id="bgMusic" loop preload="auto" src="sounds/lobby-music.wav"></audio>
<script>
(()=>{const m=document.getElementById("bgMusic");if(!m)return;const start=()=>{m.volume=0.32;m.play().catch(()=>{})};document.addEventListener("pointerdown",start,{once:true});document.addEventListener("keydown",start,{once:true});})();
</script>
</body>
</html>
