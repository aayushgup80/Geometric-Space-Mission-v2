<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter V2 — Lobby</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#050812;
  --line:rgba(190,220,255,.12);
  --muted:#77859b;
  --text:#edf5ff;
  --cyan:#8fe8ff;
  --cyan2:#3bc9ff;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
body{display:grid;place-items:center;padding:0}
.lobby{
  width:100%;
  height:100%;
  min-height:0;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 44%,rgba(38,77,116,.24),transparent 31%),
    radial-gradient(circle at 50% 100%,rgba(20,75,110,.12),transparent 35%),
    linear-gradient(145deg,#080d18,#03060d 65%,#050914);
  border:1px solid rgba(190,220,255,.13);
  box-shadow:0 35px 100px rgba(0,0,0,.55);
}
.lobby:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:110px 100%;
  opacity:.18;
}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#dff7ff;opacity:.35;animation:drift 7s linear infinite}
@keyframes drift{from{transform:translateY(0);opacity:.15}50%{opacity:.55}to{transform:translateY(80px);opacity:.08}}

.top{
  height:68px;position:relative;z-index:5;
  display:flex;align-items:center;
  padding:0 30px;
  border-bottom:1px solid var(--line);
  background:rgba(3,7,14,.54);
  backdrop-filter:blur(14px);
}
.logo{font-weight:800;letter-spacing:.16em;font-size:14px;white-space:nowrap}
.logo span{color:var(--cyan);font-size:10px;margin-left:7px}
.nav{display:flex;gap:6px;margin-left:50px;height:100%}
.nav-item{position:relative;height:100%;display:flex;align-items:center}
.nav-btn{
  width:54px;height:48px;border:0;background:transparent;color:#8593a8;
  display:grid;place-items:center;cursor:pointer;position:relative;
}
.nav-btn:after{
  content:"";position:absolute;bottom:0;left:12px;right:12px;height:2px;
  background:var(--cyan);transform:scaleX(0);transition:.2s;
  box-shadow:0 0 12px rgba(143,232,255,.7)
}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.035)}
.nav-btn:hover:after{transform:scaleX(1)}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.tooltip{
  position:absolute;top:65px;left:50%;transform:translateX(-50%) translateY(-4px);
  background:rgba(7,13,23,.96);border:1px solid rgba(143,232,255,.18);
  color:#dcecff;padding:7px 10px;border-radius:4px;font-size:10px;
  letter-spacing:.12em;white-space:nowrap;opacity:0;pointer-events:none;
  transition:.16s;box-shadow:0 10px 30px rgba(0,0,0,.35)
}
.nav-item:hover .tooltip{opacity:1;transform:translateX(-50%) translateY(0)}
.right{margin-left:auto;display:flex;align-items:center;gap:20px}
.currency{display:flex;gap:7px;align-items:center;color:#94a3b8;font-size:11px}
.currency b{color:#edf5ff;font-size:12px}
.currency i{width:8px;height:8px;display:block;transform:rotate(45deg);border:1px solid var(--cyan);opacity:.7}
.profile{
  width:38px;height:38px;border:1px solid rgba(200,230,255,.2);
  background:rgba(255,255,255,.035);display:grid;place-items:center;cursor:pointer
}
.profile svg{width:18px;stroke:#b8c8da;fill:none;stroke-width:1.4}

.center{position:relative;z-index:2;height:calc(100% - 68px);min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.status{
  position:absolute;top:44px;left:42px;color:#627187;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase
}
.status b{color:#8fe8ff;font-weight:500}
.ship-wrap{position:relative;width:390px;height:360px;display:grid;place-items:center}
.orbit{
  position:absolute;width:350px;height:350px;border:1px solid rgba(143,232,255,.07);
  border-radius:50%;transform:rotateX(66deg);animation:spin 18s linear infinite
}
.orbit:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--cyan);top:15px;left:52px;box-shadow:0 0 16px var(--cyan)}
@keyframes spin{to{transform:rotateX(66deg) rotateZ(360deg)}}
.ship{
  position:relative;width:300px;height:290px;
  filter:drop-shadow(0 26px 32px rgba(0,0,0,.5));
  animation:float 4.5s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-9px) rotate(.35deg)}}
.ship-core{
  position:absolute;left:112px;top:18px;width:76px;height:224px;
  background:linear-gradient(100deg,#34465b 0%,#b9c8d8 22%,#f4f9ff 45%,#8799ac 66%,#29394d 100%);
  clip-path:polygon(50% 0,66% 14%,78% 44%,100% 71%,77% 70%,66% 86%,60% 100%,40% 100%,34% 86%,23% 70%,0 71%,22% 44%,34% 14%);
}
.ship-core:before{
  content:"";position:absolute;left:17px;top:92px;width:42px;height:7px;
  background:linear-gradient(90deg,transparent,#8fe8ff,#fff,#8fe8ff,transparent);
  box-shadow:0 0 14px rgba(143,232,255,.9);
}
.ship-core:after{
  content:"";position:absolute;left:32px;top:35px;width:10px;height:120px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));
  filter:blur(2px);
}
.wing{
  position:absolute;top:100px;width:125px;height:115px;
  background:linear-gradient(145deg,#243448,#8ea2b7 48%,#35485d);
}
.wing.l{left:4px;clip-path:polygon(100% 0,100% 34%,72% 56%,35% 100%,0 100%,22% 55%,45% 18%)}
.wing.r{right:4px;clip-path:polygon(0 0,55% 18%,78% 55%,100% 100%,65% 100%,28% 56%,0 34%)}
.wing:after{
  content:"";position:absolute;top:35px;width:58px;height:2px;
  background:rgba(143,232,255,.55);box-shadow:0 0 8px rgba(143,232,255,.4)
}
.wing.l:after{right:8px;transform:rotate(-18deg)}
.wing.r:after{left:8px;transform:rotate(18deg)}
.cockpit{
  position:absolute;z-index:2;left:127px;top:48px;width:46px;height:64px;
  background:linear-gradient(145deg,#d9fbff 0%,#4e8aaa 38%,#142b40 100%);
  clip-path:polygon(50% 0,100% 35%,78% 100%,22% 100%,0 35%);
  box-shadow:inset 0 0 12px rgba(255,255,255,.3),0 0 14px rgba(75,199,238,.18);
}
.engine{
  position:absolute;z-index:3;top:218px;width:24px;height:64px;
  border-radius:50%;background:linear-gradient(#efffff 0%,#66dcff 28%,#24aee2 52%,transparent 100%);
  filter:blur(2px);opacity:.9
}
.engine.l{left:116px}.engine.r{right:116px}
.engine-core{
  position:absolute;top:218px;left:139px;width:22px;height:68px;
  background:linear-gradient(#fff,#8fe8ff,#27b9ee,transparent);
  filter:blur(2px);opacity:.9
}
.ship-caption{text-align:center;margin-top:-20px}
.ship-caption .name{font-size:12px;letter-spacing:.3em;font-weight:700}
.ship-caption .sub{font-size:9px;color:#68778d;letter-spacing:.18em;margin-top:7px}

.bottom{position:absolute;z-index:5;bottom:22px;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.play{
  width:330px;height:64px;position:relative;cursor:pointer;
  border:1px solid rgba(224,247,255,.8);
  background:linear-gradient(180deg,rgba(226,247,255,.97),rgba(146,207,226,.93));
  color:#06101a;font-size:17px;font-weight:900;letter-spacing:.24em;
  clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);
  transition:.18s;box-shadow:0 0 30px rgba(94,210,255,.12)
}
.play:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 0 42px rgba(94,210,255,.25)}
.play small{display:block;font-size:7px;letter-spacing:.28em;opacity:.55;margin-top:5px}
.launch{font-size:8px;color:#58677c;letter-spacing:.22em;margin-top:11px;text-transform:uppercase}
.toast{
  position:absolute;z-index:20;top:92px;right:28px;background:rgba(7,13,23,.96);
  border:1px solid rgba(143,232,255,.18);padding:10px 14px;font-size:10px;
  letter-spacing:.12em;opacity:0;transform:translateY(-5px);transition:.2s
}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-height:760px){
  .top{height:58px}
  .center{height:calc(100% - 58px)}
  .ship-wrap{transform:scale(.68);height:270px;margin-top:-20px}
  .bottom{bottom:12px}
  .play{transform:scale(.88)}
}
@media(max-height:620px){
  .top{height:52px}
  .center{height:calc(100% - 52px)}
  .ship-wrap{transform:scale(.54);height:215px;margin-top:-35px}
  .ship-caption{margin-top:-30px}
  .bottom{bottom:8px}
  .launch{display:none}
}
@media(max-width:760px){
 .top{padding:0 14px}.logo{display:none}.nav{margin-left:0}.right{gap:9px}.currency{display:none}
 .center{min-height:650px}.ship-wrap{transform:scale(.8)}.bottom{bottom:25px}.play{width:280px}
 .status{left:18px}
}
</style>
</head>
<body>
<div class="lobby" id="lobby">
<audio id="lobbyMusic" preload="auto" loop src="sounds/lobby-music.wav"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<audio id="uiHover" preload="auto" src="sounds/button-hover.mp3"></audio>
<audio id="uiClick" preload="auto" src="sounds/button-click.mp3"></audio>
<div class="stars" id="stars"></div>

<header class="top">
  <div class="logo">Geometric Space Mission // GSM <span>V2</span></div>

  <nav class="nav">
    <div class="nav-item">
      <button class="nav-btn" data-name="Hangar" aria-label="Hangar">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 5v8l-8 5-8-5V8l8-5Z"/><path d="M8 10l4-2 4 2v5l-4 2-4-2v-5Z"/></svg>
      </button><span class="tooltip">HANGAR</span>
    </div>
    <div class="nav-item">
      <button class="nav-btn" data-name="Shop" aria-label="Shop">
        <svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5L4 8Z"/><path d="M8 8a4 4 0 0 1 8 0"/></svg>
      </button><span class="tooltip">SHOP</span>
    </div>
    <div class="nav-item">
      <button class="nav-btn" data-name="Missions" aria-label="Missions">
        <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h5M8 16h7"/></svg>
      </button><span class="tooltip">MISSIONS</span>
    </div>
    <div class="nav-item">
      <button class="nav-btn" data-name="Armory" aria-label="Armory">
        <svg viewBox="0 0 24 24"><path d="M4 18h16M6 18v-4l5-3 7 3v4"/><path d="M8 9l4-4 4 4-4 2-4-2Z"/></svg>
      </button><span class="tooltip">ARMORY</span>
    </div>
    <div class="nav-item">
      <button class="nav-btn" data-name="Leaderboard" aria-label="Leaderboard">
        <svg viewBox="0 0 24 24"><path d="M5 20V9h4v11M10 20V4h4v16M15 20v-7h4v7"/></svg>
      </button><span class="tooltip">LEADERBOARD</span>
    </div>
  </nav>

  <div class="right">
<div class="currency">
  <i class="crix-icon"></i>
  <b id="crixBalance">12,450</b>
  <span>CRIX</span>
</div>

<div class="currency">
  <i class="mtoken-icon"></i>
  <b id="mtokenBalance">250</b>
  <span>M-TOKENS</span>
</div>
    <button class="profile" data-name="Profile" aria-label="Profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg>
    </button>
  </div>
</header>

<main class="center">
  <div class="status">STATUS <b>● ONLINE</b></div>
  <section class="ship-wrap">
    <div class="orbit"></div>
    <div class="ship" aria-label="Nova spaceship">
      <div class="wing l"></div><div class="wing r"></div>
      <div class="ship-core"></div><div class="cockpit"></div>
      <div class="engine l"></div><div class="engine r"></div><div class="engine-core"></div>
    </div>
    <div class="ship-caption">
      <div class="name">NOVA</div>
      <div class="sub">STARTER INTERCEPTOR</div>
    </div>
  </section>
</main>

<div class="bottom">
  <!-- From Uiverse.io by Yaseen549 --> 
<button id="play" 
  class="group relative px-8 py-4 font-bold text-white uppercase tracking-wider rounded-2xl 
         bg-red-500 border-b-[8px] border-red-700 
         active:border-b-[0px] active:translate-y-[8px] 
         transition-all duration-100 
         
         hover:bg-red-400 
         hover:-translate-y-1 
         hover:scale-[1.03]
         hover:shadow-[0_20px_35px_-8px_rgba(239,68,68,0.95)]
         
         shadow-[0_15px_25px_-10px_rgba(239,68,68,0.8)] 
         focus:outline-none focus:ring-4 focus:ring-red-400/50" 
>
  <span 
    class="absolute inset-0 w-full h-full rounded-2xl 
           bg-gradient-to-t from-black/20 to-transparent 
           pointer-events-none"
  ></span> 

  <span 
    class="absolute top-2 left-3 w-6 h-3 rounded-full 
           bg-white/40 blur-[2px] pointer-events-none
           transition-all duration-200
           group-hover:w-10 group-hover:bg-white/60"
  ></span> 

  <span class="relative flex items-center justify-center gap-2 drop-shadow-md"> 
    <svg 
      class="w-6 h-6 animate-pulse transition-transform duration-200
             group-hover:scale-125 group-hover:rotate-3" 
      fill="none" 
      stroke="currentColor" 
      stroke-width="2" 
      viewBox="0 0 24 24"
    > 
      <path 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        d="M13 10V3L4 14h7v7l9-11h-7z"
      ></path> 
    </svg> 

    Play 
  </span> 
</button>

  <div class="launch">Press Enter to launch</div>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
const lobby=document.getElementById("lobby");
const stars=document.getElementById("stars");
const lobbyMusic=document.getElementById("lobbyMusic");
const uiHover=document.getElementById("uiHover");
const uiClick=document.getElementById("uiClick");

let musicStarted=false;

function playSound(audio){
  try{
    audio.currentTime=0;
    audio.play().catch(()=>{});
  }catch(e){}
}

function startLobbyMusic(){
  lobbyMusic.volume=0.34;
  lobbyMusic.play().then(()=>{musicStarted=true}).catch(()=>{musicStarted=false});
}
// Try immediately; browsers that block autoplay will start it on the first interaction.
startLobbyMusic();

const interactiveSelector="button,a,[role=\"button\"]";
document.addEventListener("mouseover",e=>{const el=e.target.closest(interactiveSelector);if(el)playSound(uiHover)});
document.addEventListener("click",e=>{const el=e.target.closest(interactiveSelector);if(el){playSound(uiClick);startLobbyMusic()}});

// Browser autoplay rules normally require a user gesture.
// Start the lobby music on the first click/tap/key interaction.
["pointerdown","keydown"].forEach(eventName=>{
  document.addEventListener(eventName,startLobbyMusic,{once:true});
});
for(let i=0;i<90;i++){
  const s=document.createElement("span");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(-Math.random()*7)+"s";
  s.style.opacity=(.12+Math.random()*.35).toFixed(2);
  stars.appendChild(s);
}
const toast=document.getElementById("toast");
let timer;
function notify(name){
  toast.textContent=name.toUpperCase()+"  //  COMING SOON";
  toast.classList.add("show");
  clearTimeout(timer);
  timer=setTimeout(()=>toast.classList.remove("show"),1200);
}
document.querySelectorAll("[data-name]").forEach(el=>{
  el.addEventListener("click",()=>notify(el.dataset.name));
});
document.getElementById("play").addEventListener("click",()=>{ playSound(uiClick); startLobbyMusic(); window.location.href="game.html"; });
document.querySelector(".profile").addEventListener("click",async()=>{const c=window.supabase.createClient("https://ccdllfswfhtgcolkugbz.supabase.co","sb_publishable_LPd-zxWUKM8c1p2P9sbbuA_EmhtqQr5");await c.auth.signOut();window.location.href="login.html"});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("play").click();
});
async function requireAuth(){
 const client=window.supabase.createClient("https://ccdllfswfhtgcolkugbz.supabase.co","sb_publishable_LPd-zxWUKM8c1p2P9sbbuA_EmhtqQr5");
 const {data:{session}}=await client.auth.getSession();
 if(!session?.user){window.location.href="login.html";return null}
 let {data:profile,error}=await client.from("player_profiles").select("username,crix,m_tokens").eq("id",session.user.id).maybeSingle();
 if(error){console.error(error);return session.user}
 if(!profile){
   const username=session.user.user_metadata?.username||session.user.email.split("@")[0];
   const created=await client.from("player_profiles").insert({id:session.user.id,username,crix:10,m_tokens:0}).select("username,crix,m_tokens").single();
   if(created.error){console.error(created.error);return session.user}
   profile=created.data;
 }
 document.getElementById("crixBalance").textContent=Number(profile.crix||0).toLocaleString();
 document.getElementById("mtokenBalance").textContent=Number(profile.m_tokens||0).toLocaleString();
 const status=document.querySelector(".status");
 if(status) status.innerHTML='STATUS <b>● ONLINE</b> · '+(profile.username||session.user.email.split("@")[0]).toUpperCase();
 return session.user;
}
requireAuth();
</script>
</body>
</html>
