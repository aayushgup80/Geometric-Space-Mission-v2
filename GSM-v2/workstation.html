<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.83.0/dist/umd/supabase.min.js"></script><script>
const TOUCAN_URL="https://eylmduhkjrvpowvuejex.supabase.co",TOUCAN_KEY="sb_publishable_a23t-KV73iSoBA29igsnAQ_phuSvlEb",GSM_URL="https://ccdllfswfhtgcolkugbz.supabase.co",GSM_KEY="sb_publishable_LPd-zxWUKM8c1p2P9sbbuA_EmhtqQr5";const sb=supabase.createClient(TOUCAN_URL,TOUCAN_KEY);let session,d;
async function api(action,body={}){const r=await fetch(GSM_URL+"/functions/v1/toucan-api",{method:"POST",headers:{apikey:GSM_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({...body,action})});const x=await r.json().catch(()=>({}));if(!r.ok||x?.ok===false)throw Error(x?.error||"REQUEST FAILED");return x}
function render(){const hp=Number(d.hull_hp||0),max=Number(d.hull_max||100),missing=Math.max(0,max-hp),cost=Math.ceil(missing/5);document.getElementById("ship").textContent="EQUIPPED HULL // "+((d.items.find(x=>x.id===d.loadout.ship_id)||{}).name||"GSM SCOUT").toUpperCase();document.getElementById("hp").textContent=hp+" / "+max+" HP";document.getElementById("fill").style.width=Math.max(0,Math.min(100,hp/max*100))+"%";document.getElementById("cost").textContent="REPAIR COST: ₢ "+cost;document.getElementById("repair").disabled=missing===0;document.getElementById("repair").textContent=missing===0?"HULL FULL":"REPAIR TO FULL"}
(async()=>{try{const q=await sb.auth.getSession();session=q.data.session;if(!session){location.replace("login.html");return}d=await api("bootstrap");document.getElementById("acct").innerHTML=(d.profile.username||"PILOT").toUpperCase()+"<br><strong>₢ "+Number(d.profile.crix||0).toLocaleString()+"</strong> · LV "+(d.profile.level||1);render()}catch(e){document.getElementById("result").textContent=e.message}})();
document.getElementById("repair").onclick=async()=>{const b=document.getElementById("repair"),o=document.getElementById("result");b.disabled=true;o.textContent="REPAIRING...";try{const x=await api("repair_hull",{max_hp:d.hull_max});d.hull_hp=x.hull_hp;d.profile.crix=x.crix;document.getElementById("acct").innerHTML=(d.profile.username||"PILOT").toUpperCase()+"<br><strong>₢ "+Number(x.crix).toLocaleString()+"</strong> · LV "+(d.profile.level||1);localStorage.gsmHullHp=String(x.hull_hp);o.textContent="HULL FULL // READY FOR SORTIE";render()}catch(e){o.textContent=e.message}finally{b.disabled=false}};
</script></body></html>
